schema = 1

[project]
type = "package"
name = "agent-hub-demo"

[version]
required = true
strategy = "semver"
next = "auto"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[[version.files]]
type = "json"
path = ".buildchain/kfd/agent-hub.json"
key = "adapter.version"

[lifecycle.install]
command = "npm ci --registry=https://registry.npmjs.org/"

[lifecycle.build]
command = "npm run build"

[lifecycle.verify]
command = "npm run check"

[lifecycle.publish]
command = "node scripts/write-publish-evidence.mjs"

[[signing.artifacts]]
id = "agent-hub-demo-linux-x64"
path = "dist/agent-hub-demo-linux-x64"
profile = "auto"
kind = "binary"
platforms = ["linux-x64"]
required = true

[[signing.artifacts]]
id = "agent-hub-demo-macos-arm64"
path = "dist/agent-hub-demo-macos-arm64"
profile = "auto"
kind = "mach-o"
platforms = ["macos"]
required = true
