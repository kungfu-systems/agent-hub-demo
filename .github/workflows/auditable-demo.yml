name: Auditable Demo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the shared binary auditable demo logic
        required: true
        default: gate
        type: choice
        options:
          - gate
          - full
      materialize:
        description: Open or update the protected README media pull request after a full run
        required: true
        default: false
        type: boolean
      base-ref:
        description: Target branch for a manually requested README media pull request
        required: true
        default: dev/v0/v0.2
        type: string

permissions:
  contents: read

jobs:
  auditable-demo-binary:
    name: Build exact Agent Hub Demo demo binary
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
      attestations: write
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}

  auditable-demo:
    name: Consume declarative standalone-binary demo platform
    needs: auditable-demo-binary
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/public-build-demo.yml@v4
    with:
      source-ref: ${{ fromJSON(needs.auditable-demo-binary.outputs.result).source.sha }}
      binary-artifact-name: ${{ fromJSON(needs.auditable-demo-binary.outputs.result).artifacts.payloads[0].name }}
      binary-artifact-digest: ${{ fromJSON(needs.auditable-demo-binary.outputs.result).artifacts.payloads[0].digest }}
      scenario-path: .buildchain/auditable-demo.json
      renderer-image: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:3a49708163fedaaabe07b45bba910026a1828151b5d4e9bbdaf0d62e75c927c1
      render-media: ${{ inputs.mode == 'full' }}
      media-profile: responsive-web-delivery-v1
      materialize: ${{ inputs.mode == 'full' && inputs.materialize }}
      materialize-base-ref: ${{ inputs['base-ref'] }}
      artifact-retention-days: 14
    secrets:
      DEMO_UPDATE_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
