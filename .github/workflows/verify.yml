name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/public-build-check.yml@v4
    with:
      require-version-state: true
      upload-artifacts: true
