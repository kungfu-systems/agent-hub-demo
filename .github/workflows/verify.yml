name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@05ea5812541b8bb1f707a39f0d38562bf77d1589
    with:
      buildchain-ref: 05ea5812541b8bb1f707a39f0d38562bf77d1589
      require-version-state: true
      upload-artifacts: true
