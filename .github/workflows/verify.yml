name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@44e1c35b626e4950f0b3474cb124efee75bb7310
    with:
      buildchain-ref: 44e1c35b626e4950f0b3474cb124efee75bb7310
      require-version-state: true
      upload-artifacts: true
