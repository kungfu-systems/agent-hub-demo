name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@3079091f770ce9fdca950e106259e34e5171f763
    with:
      buildchain-ref: 3079091f770ce9fdca950e106259e34e5171f763
      require-version-state: true
      upload-artifacts: true
