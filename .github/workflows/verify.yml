name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@a4c247055e9ea17eee5fe5907341f6945a135a24
    with:
      buildchain-ref: a4c247055e9ea17eee5fe5907341f6945a135a24
      require-version-state: true
      upload-artifacts: true
