name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@a5f9172943d0d15de0713834c897fa9335cc1c7b
    with:
      buildchain-ref: a5f9172943d0d15de0713834c897fa9335cc1c7b
      require-version-state: true
      upload-artifacts: true
