name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@f4f2471269521e56a6f1c2a743f8244dc2a9a557
    with:
      buildchain-ref: f4f2471269521e56a6f1c2a743f8244dc2a9a557
      require-version-state: true
      upload-artifacts: true
