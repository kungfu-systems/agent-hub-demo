name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@98dc8e3d628b558bc8b35a91a821ad6c97334b77
    with:
      buildchain-ref: 98dc8e3d628b558bc8b35a91a821ad6c97334b77
      require-version-state: true
      upload-artifacts: true
