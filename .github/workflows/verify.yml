name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@c4e699bcbcde48a3749ef0ec1b6aa92c39a0d99a
    with:
      buildchain-ref: c4e699bcbcde48a3749ef0ec1b6aa92c39a0d99a
      require-version-state: true
      upload-artifacts: true
