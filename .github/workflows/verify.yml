name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@d4622ccd6255445d3f9d0fff9082e7977d7549ca
    with:
      buildchain-ref: d4622ccd6255445d3f9d0fff9082e7977d7549ca
      require-version-state: true
      upload-artifacts: true
