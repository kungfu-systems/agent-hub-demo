name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@6e1ce404568ff8d45aba77369c66cf490893facc
    with:
      buildchain-ref: 6e1ce404568ff8d45aba77369c66cf490893facc
      require-version-state: true
      upload-artifacts: true
