name: Verify

on:
  pull_request:
  push:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@fea8e21dcec2cbf21b9e7fca8fefb537b6b6999c
    with:
      buildchain-ref: fea8e21dcec2cbf21b9e7fca8fefb537b6b6999c
      require-version-state: true
      upload-artifacts: true
