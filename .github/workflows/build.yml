name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
      attestations: write
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}

  auditable-demo-promotion:
    name: Consume production Buildchain artifact for auditable demo
    needs: build
    if: ${{ startsWith(github.base_ref, 'alpha/') || startsWith(github.base_ref, 'release/') }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/public-build-demo.yml@v4
    with:
      source-ref: ${{ fromJSON(needs.build.outputs.result).source.sha }}
      binary-artifact-name: ${{ fromJSON(needs.build.outputs.result).artifacts.payloads[0].name }}
      binary-artifact-digest: ${{ fromJSON(needs.build.outputs.result).artifacts.payloads[0].digest }}
      scenario-path: .buildchain/auditable-demo.json
      renderer-image: ghcr.io/kungfu-systems/build-images/demo-renderer@sha256:3a49708163fedaaabe07b45bba910026a1828151b5d4e9bbdaf0d62e75c927c1
      render-media: true
      media-profile: responsive-web-delivery-v1
      materialize: true
      materialize-base-ref: ${{ github.head_ref }}
      artifact-retention-days: 14
    secrets:
      DEMO_UPDATE_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
