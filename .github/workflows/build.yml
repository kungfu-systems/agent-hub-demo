name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: Temporary Buildchain runtime ref for trusted manual validation
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3
    with:
      node-version: "24"
      install-command: npm ci --registry=https://registry.npmjs.org/
      build-command: npm run build
      verify-command: npm run check && npm run qualify:buildchain-release
      kfd-agent-hub: off
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: agent-hub-demo
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        dist
        .buildchain/artifacts
        .buildchain/kfd/kfd-2
        .buildchain/release-qualification
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'release/') && 'release' || (startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none') }}

  signing-dogfood:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@train/v3/v3.0/artifact-signing-authority
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || 'train/v3/v3.0/artifact-signing-authority' }}
      node-version: "24"
      install-command: npm ci --registry=https://registry.npmjs.org/
      build-command: npm run build
      verify-command: npm run verify:signed-release
      kfd-agent-hub: off
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: agent-hub-demo
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        dist
        .buildchain/artifacts
        .buildchain/kfd/kfd-2
        .buildchain/release-qualification
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'release/') && 'release' || (startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none') }}
