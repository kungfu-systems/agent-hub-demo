name: V4 Alpha Adopter Delivery Qualification

on:
  pull_request:
    branches:
      - dev/v0/v0.2
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    permissions:
      contents: read
    uses: kungfu-systems/buildchain/.github/workflows/v4-adopter-delivery.yml@v4-alpha
    with:
      consumer: agent-hub-demo
      node-version: "24"
      input-path: .buildchain/qualification/v4-adopter-delivery/input.json
      bootstrap-path: .buildchain/qualification/v4-adopter-delivery/bootstrap.json
      archive-path: .buildchain/qualification/v4-adopter-delivery/archives.json

  bootstrap-delivery:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'state/ready' &&
        github.event.pull_request.number == 139 &&
        github.event.pull_request.head.ref == 'feature/v4-floating-consumer-adoption'
      }}
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: write
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@v4-alpha
    with:
      buildchain-ref: v4-alpha
      target-branch: dev/v0/v0.2
      expected-pr-number: ${{ github.event.pull_request.number }}
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      source-workflow-run-id: 0
      handoff-workflow-id: native-dev-delivery.yml
      source-workflow-id: verify.yml
      delivery-warrant-mode: required
      assignment-root: sha256:493892932992b823e9741d949a49db3ddf428b297c48c5b542463a2b40ee763f
      initiative-root: sha256:f4c5ba0457c25f6a54234a6fc189b8498dcf76afae6e670d9069300a30342990
      source-identity-root: sha256:0bcbbc2747c4267f03d471cc3b9112e3806944decbe20faf760aa31f81064554
      source-patch-root: sha256:c1597fe3393294304070f34218bac0f6da05081fa4d0a152765a8a76f2690b50
      plan-root: sha256:58a7da79b198473f16d1e86183d5b5f10ff68e02a5ad7b6898d0ed0eb780a888
      closure-root: sha256:c48bac5365af3e0e421871a2c3c71e3ad6a8f550c5473969a0b1aa62d001219c
      dependency-root: sha256:ebd477d1ee17f1c57d413fa97f20cd45515e03d4d8554d4963b977950779446c
      toolchain-root: sha256:48d09bc488ba0989be885d208e8e7f901b79db1a1895f68f5225bd4a241507ad
      environment-root: sha256:f604c0a63ac3cdfa49d67bd2162339f8f25171ec88907c8f5edb4643a2c3e273
      affected-paths-json: '[".github/workflows/buildchain-ref-promotion.yml",".github/workflows/v4-adopter-delivery-qualification.yml","test/auditable-demo-contract.test.js"]'
      native-command: >-
        node24_bin="$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '24.*' -print | sort -V | tail -n 1)/x64/bin" &&
        test -x "$node24_bin/node" &&
        export PATH="$node24_bin:$PATH" &&
        node --version &&
        npm ci --registry=https://registry.npmjs.org/ &&
        npm run check
      native-heartbeat-seconds: 30
      delivery-class: release
      delivery-priority: ordinary
      required-status-checks: check / check
      queue-admission-context: Queue admission lease
      active-lease-context: Queue family lease/exact
      ready-label: state/ready
      landing-mode: auto
      dry-run: false
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
