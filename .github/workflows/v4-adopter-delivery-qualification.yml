name: V4 Alpha Adopter Delivery Qualification

on:
  pull_request:
    branches:
      - dev/v0/v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    uses: kungfu-systems/buildchain/.github/workflows/v4-adopter-delivery.yml@v4-alpha
    with:
      consumer: agent-hub-demo
      node-version: "24"
      input-path: .buildchain/qualification/v4-adopter-delivery/input.json
      bootstrap-path: .buildchain/qualification/v4-adopter-delivery/bootstrap.json
      archive-path: .buildchain/qualification/v4-adopter-delivery/archives.json
