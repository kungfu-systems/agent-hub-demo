name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to qualify; defaults to package.json version
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Resolve release coordinates
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          requested_tag="${{ inputs.tag }}"
          release_tag="${requested_tag:-v${package_version}}"
          if [[ "${release_tag}" != "v${package_version}" ]]; then
            echo "tag ${release_tag} does not match package version v${package_version}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Install exact public dependency graph
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Prove clean clone before generated evidence
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Test, soak, and build
        run: npm run check

      - name: Run public Agent Hub gate
        run: >-
          npx --yes --package @kungfu-tech/buildchain@2.14.15
          buildchain kfd hub test --for agent

      - name: Render KFD-2 product claim
        run: >-
          npx --yes --package @kungfu-tech/buildchain@2.14.15
          buildchain kfd 2 product-claims write
          --source-sha "${GITHUB_SHA}"
          --tag "${RELEASE_TAG}"
          --json

      - name: Produce KFD-3 prebuild witness
        run: >-
          npx --yes --package @kungfu-tech/buildchain@2.14.15
          buildchain kfd 3 witness
          --kind prebuild
          --source-sha "${GITHUB_SHA}"
          --output .buildchain/release-qualification/kfd-3-prebuild.json

      - name: Prepare product-owned KFD-1 and KFD-3 artifact witnesses
        run: >-
          npm run prepare:release-evidence --
          --source-sha "${GITHUB_SHA}"

      - name: Verify KFD-1 artifact closure
        shell: bash
        run: |
          npx --yes --package @kungfu-tech/buildchain@2.14.15 \
            buildchain kfd 1 gate \
            --witness-json .buildchain/release-qualification/kfd-1-witness.json \
            --artifact-root dist \
            --output .buildchain/release-qualification/kfd-1-gate.json \
            --json
          jq '.passportSection' \
            .buildchain/release-qualification/kfd-1-gate.json \
            > .buildchain/release-qualification/kfd-1-gate-section.json
          npx --yes --package @kungfu-tech/buildchain@2.14.15 \
            buildchain kfd 1 verify \
            --gate-json .buildchain/release-qualification/kfd-1-gate-section.json \
            --json

      - name: Run twelve fail-closed mutations
        run: npm run qualify:release

      - name: Collect and independently verify Release Passport
        shell: bash
        run: |
          npx --yes --package @kungfu-tech/buildchain@2.14.15 \
            buildchain collect github-release \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --product-name "Agent Hub Demo" \
            --package-name @kungfu-tech/agent-hub-demo \
            --package-version "${PACKAGE_VERSION}" \
            --assets-dir dist \
            --kfd-1-witness-json .buildchain/release-qualification/kfd-1-witness.json \
            --kfd-2-claim-json .buildchain/kfd/kfd-2/claims/first-party-clean-room-structural-independence.json \
            --kfd-3-prebuild-witness-json .buildchain/release-qualification/kfd-3-prebuild.json \
            --kfd-3-artifact-witness-json .buildchain/release-qualification/kfd-3-artifact.json \
            --kfd-agent-hub-evidence-json .buildchain/artifacts/kfd-agent-hub/evidence.json \
            --output-dir .buildchain/release-passport \
            --json
          npx --yes --package @kungfu-tech/buildchain@2.14.15 \
            buildchain verify release-passport \
            .buildchain/release-passport/buildchain.release.json \
            --json
          npm run qualify:passport

      - name: Assemble checksummed public release assets
        shell: bash
        run: |
          asset_dir=".buildchain/release-qualification/assets"
          mkdir -p "${asset_dir}"
          cp dist/agent-hub-demo.json "${asset_dir}/"
          cp .buildchain/artifacts/kfd-agent-hub/adoption-lock.json "${asset_dir}/kfd-agent-hub-adoption-lock.json"
          cp .buildchain/artifacts/kfd-agent-hub/evidence.json "${asset_dir}/kfd-agent-hub-evidence.json"
          cp .buildchain/artifacts/kfd-agent-hub/report.json "${asset_dir}/kfd-agent-hub-report.json"
          cp .buildchain/artifacts/kfd-agent-hub/verification.json "${asset_dir}/kfd-agent-hub-verification.json"
          cp .buildchain/kfd/kfd-2/release-claims.json "${asset_dir}/kfd-2-release-claims.json"
          cp .buildchain/kfd/kfd-2/claims/first-party-clean-room-structural-independence.json "${asset_dir}/kfd-2-first-party-clean-room-claim.json"
          cp .buildchain/release-qualification/kfd-1-witness.json "${asset_dir}/"
          cp .buildchain/release-qualification/kfd-1-gate-section.json "${asset_dir}/kfd-1-gate.json"
          cp .buildchain/release-qualification/kfd-3-prebuild.json "${asset_dir}/"
          cp .buildchain/release-qualification/kfd-3-artifact.json "${asset_dir}/"
          cp .buildchain/release-qualification/qualification-report.json "${asset_dir}/"
          cp .buildchain/release-qualification/passport-qualification.json "${asset_dir}/"
          cp .buildchain/release-passport/buildchain.release.json "${asset_dir}/"
          cp .buildchain/release-passport/artifact-evidence.json "${asset_dir}/"
          cp .buildchain/release-passport/check-report.json "${asset_dir}/"
          (
            cd "${asset_dir}"
            sha256sum ./* > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-demo-release-qualification-${{ env.RELEASE_TAG }}
          path: .buildchain/release-qualification/assets
          if-no-files-found: error

      - name: Publish tagged GitHub prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              .buildchain/release-qualification/assets/* \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              .buildchain/release-qualification/assets/* \
              --verify-tag \
              --prerelease \
              --title "Agent Hub Demo ${RELEASE_TAG}" \
              --notes-file docs/RELEASE_QUALIFICATION.md
          fi
