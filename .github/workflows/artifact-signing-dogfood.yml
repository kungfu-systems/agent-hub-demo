name: Artifact Signing Dogfood

on:
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: Protected Buildchain artifact-signing authority ref or exact SHA
        required: false
        default: authority/v3/v3.0/artifact-signing

permissions:
  contents: read

jobs:
  signing-dogfood:
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@authority/v3/v3.0/artifact-signing
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
    with:
      buildchain-ref: ${{ inputs.buildchain-ref }}
      node-version: "24"
      install-command: npm ci --registry=https://registry.npmjs.org/
      build-command: npm run build
      verify-command: npm run verify:signed-release
      kfd-agent-hub: off
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: agent-hub-demo
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        dist
        .buildchain/artifacts
        .buildchain/kfd/kfd-2
        .buildchain/release-qualification
      release-candidate: true
      publish-channel: none
